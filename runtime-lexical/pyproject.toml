[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-text-bench"
version = "0.1.0"
description = "Reproducible local LoCoMo-Refined and LongMemEval-S retrieval baselines"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "requests>=2.31,<3"]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27,<1"]
lexical = ["nltk>=3.8,<4"]
benchmarks = ["pyarrow>=14"]
service = ["fastapi>=0.124,<1", "pydantic>=2.12,<3", "uvicorn>=0.29,<1"]

[tool.setuptools.packages.find]
include = ["memory_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
