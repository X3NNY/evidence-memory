name: evidence-memory-lexical
services:
  text-memory-lexical:
    build:
      context: ./runtime-lexical
    restart: unless-stopped
    init: true
    read_only: true
    ports:
      - "127.0.0.1:8788:8787"
    environment:
      AML_MEMORY_SYSTEM_KEY_FILE: /run/secrets/memory_system_key
      AML_RETRIEVER: lexical
      AML_EMBEDDING_MODE: cache_only
      AML_ALLOW_EMBEDDING_API: "0"
      AML_CACHE_USERS: "2"
      AML_QUERY_CACHE_ENTRIES: "16"
      AML_QUERY_CACHE_BYTES: "4194304"
      AML_WINDOW_CONTEXT_CHARS: "48000"
      AML_SESSION_FRAMES: "1"
    secrets:
      - memory_system_key
    volumes:
      - lexical-data:/app/var
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1536m
    memswap_limit: 2048m
    cpus: 1.5
    pids_limit: 256
secrets:
  memory_system_key:
    file: "${AML_MEMORY_SYSTEM_KEY_FILE:?Set the host key-file path}"
volumes:
  lexical-data:
